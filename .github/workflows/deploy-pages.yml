name: Publish live WhatsApp inbox

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: whatsapp-inbox-publish
  cancel-in-progress: true

env:
  VITE_DEMO_MODE: "false"
  VITE_SUPABASE_URL: "https://daifcmqjtkmkxxxnnyos.supabase.co"
  VITE_SUPABASE_ANON_KEY: "sb_publishable_vFjCrktsy1JyidvMIo1CXg_Ox7VioRv"
  VITE_FUNCTIONS_URL: "https://daifcmqjtkmkxxxnnyos.supabase.co/functions/v1"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Publish verified build to gh-pages
        run: |
          rm -rf /tmp/whatsapp-inbox-site
          mkdir -p /tmp/whatsapp-inbox-site
          cp -R dist/. /tmp/whatsapp-inbox-site/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages
          git rm -rf .
          cp -R /tmp/whatsapp-inbox-site/. .
          touch .nojekyll
          git add -A
          git commit -m "deploy: live WhatsApp inbox ${GITHUB_SHA}"
          git push --force origin gh-pages
