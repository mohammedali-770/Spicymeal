name: Build live WhatsApp inbox

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  VITE_DEMO_MODE: "false"
  VITE_SUPABASE_URL: "https://daifcmqjtkmkxxxnnyos.supabase.co"
  VITE_SUPABASE_ANON_KEY: "sb_publishable_vFjCrktsy1JyidvMIo1CXg_Ox7VioRv"
  VITE_FUNCTIONS_URL: "https://daifcmqjtkmkxxxnnyos.supabase.co/functions/v1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: live-inbox-dist
          path: dist
          if-no-files-found: error
          retention-days: 7
