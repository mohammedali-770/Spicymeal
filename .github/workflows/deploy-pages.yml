name: Deploy live WhatsApp inbox

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - name: Build live inbox
        run: npm run build
        env:
          VITE_DEMO_MODE: "false"
          VITE_SUPABASE_URL: "https://daifcmqjtkmkxxxnnyos.supabase.co"
          VITE_SUPABASE_ANON_KEY: "sb_publishable_vFjCrktsy1JyidvMIo1CXg_Ox7VioRv"
          VITE_FUNCTIONS_URL: "https://daifcmqjtkmkxxxnnyos.supabase.co/functions/v1"
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
